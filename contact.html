<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | TWO ISLANDS</title>
<meta name="description" content="TWO ISLANDSへのサービスに関するご質問・ご相談はこちらのフォームよりお気軽にお問い合わせください。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Cinzel:wght@400;500&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6;
  --bg-blue:#EFF3F6;
  --ink:#1A1A18;
  --body:#4B4A45;
  --muted:#8C887F;
  --line:rgba(26,26,24,.12);
  --line-strong:rgba(26,26,24,.24);
  --gold:#B08D3E;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--body);
  font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
  font-size:16px;
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:760px;margin:0 auto;padding:0 6vw;}
.jp{font-family:"Shippori Mincho",serif;}
.display{font-family:"Playfair Display",serif;}
.label{font-family:Cinzel,serif;}

header{
  position:relative;padding:26px 6vw;
  display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:1px solid var(--line);
}
.logo-block .logo{font-family:"Playfair Display",serif;font-size:15px;letter-spacing:.3em;font-weight:500;color:var(--ink);}
.logo-block .sub{display:block;font-family:Cinzel,serif;font-size:8.5px;letter-spacing:.22em;color:var(--muted);margin-top:4px;text-transform:lowercase;}
header nav a{font-size:12px;letter-spacing:.02em;color:var(--body);border-bottom:1px solid var(--line-strong);padding-bottom:2px;}

.page-head{padding:9vh 0 6vh;text-align:center;}
.eyebrow{font-family:Cinzel,serif;font-size:12px;letter-spacing:.26em;color:var(--muted);text-transform:lowercase;margin-bottom:18px;}
h1.big{font-family:"Playfair Display",serif;font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1.3;letter-spacing:.01em;color:var(--ink);margin-bottom:26px;}
.lead{max-width:600px;margin:0 auto;font-family:"Shippori Mincho",serif;font-size:13.5px;line-height:2.4;color:var(--body);}
.lead a{color:var(--ink);border-bottom:1px solid var(--line-strong);}

.f-section{padding:6vh 0;border-top:1px solid var(--line);}
.f-section h2{font-family:"Shippori Mincho",serif;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:8px;letter-spacing:.02em;}
.f-section .f-sub{font-family:Cinzel,serif;font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:lowercase;margin-bottom:30px;display:block;}
.f-group{margin-bottom:24px;}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.f-group label{display:block;font-family:"Shippori Mincho",serif;font-size:12.5px;color:var(--ink);margin-bottom:10px;letter-spacing:.02em;}
.f-group label .req{color:var(--gold);font-size:10px;margin-left:6px;font-family:Cinzel,serif;}
.f-group label .opt{color:var(--muted);font-size:10px;margin-left:6px;font-family:Cinzel,serif;}
.f-group input[type=text],
.f-group input[type=email],
.f-group input[type=tel],
.f-group select,
.f-group textarea{
  width:100%;padding:14px 14px;border:1px solid var(--line-strong);background:var(--bg);
  font-family:"Shippori Mincho",serif;font-size:13px;color:var(--ink);
}
.f-group textarea{min-height:160px;resize:vertical;}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{outline:none;border-color:var(--gold);}

.type-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.type-option{position:relative;}
.type-option input{position:absolute;opacity:0;}
.type-option span{
  display:block;padding:16px 18px;border:1px solid var(--line-strong);
  font-family:"Shippori Mincho",serif;font-size:12.5px;color:var(--body);
  cursor:pointer;transition:border-color .3s,background .3s,color .3s;
}
.type-option input:checked + span{border-color:var(--ink);background:var(--ink);color:#fff;}
@media(max-width:640px){.type-options{grid-template-columns:1fr;}.f-row{grid-template-columns:1fr;}}

.btn-fill{
  display:inline-block;background:var(--ink);border:1px solid var(--ink);color:#fff;
  padding:18px 0;width:100%;text-align:center;font-family:"Shippori Mincho",serif;font-size:14px;letter-spacing:.06em;
  cursor:pointer;transition:background .4s,border-color .4s;
}
.btn-fill:hover{background:var(--gold);border-color:var(--gold);}

.submit-block{padding:6vh 0 12vh;}
.submit-note{text-align:center;margin-top:20px;font-family:"Shippori Mincho",serif;font-size:12px;color:var(--muted);}

footer{border-top:1px solid var(--line);padding:40px 6vw;text-align:center;font-family:"Shippori Mincho",serif;font-size:11px;color:var(--muted);}
</style>
</head>
<body>

<header>
  <a class="logo-block" href="index.html">
    <span class="logo">TWO ISLANDS</span>
    <span class="sub">Serendib Journey</span>
  </a>
  <nav><a href="index.html">top へ戻る</a></nav>
</header>

<div class="page-head">
  <p class="eyebrow">contact</p>
  <h1 class="big">お問い合わせ</h1>
  <p class="lead">サービスに関するご質問・ご相談は、以下のフォームよりお気軽にお問い合わせください。占星術鑑定のお申込みは<a href="reading.html">鑑定申込フォーム</a>よりお願いいたします。</p>
</div>

<form class="wrap" onsubmit="return false;">

  <div class="f-section">
    <h2>お客様情報</h2>
    <span class="f-sub">your information</span>
    <div class="f-row">
      <div class="f-group"><label>お名前 <span class="req">必須</span></label><input type="text" required></div>
      <div class="f-group"><label>フリガナ <span class="opt">任意</span></label><input type="text"></div>
    </div>
    <div class="f-row">
      <div class="f-group"><label>メールアドレス <span class="req">必須</span></label><input type="email" required></div>
      <div class="f-group"><label>電話番号 <span class="opt">任意</span></label><input type="tel"></div>
    </div>
  </div>

  <div class="f-section">
    <h2>お問い合わせ内容</h2>
    <span class="f-sub">inquiry</span>
    <div class="f-group">
      <label>お問い合わせ種別 <span class="req">必須</span></label>
      <div class="type-options">
        <label class="type-option"><input type="radio" name="inquiryType" required><span>サービス内容について</span></label>
        <label class="type-option"><input type="radio" name="inquiryType"><span>プラン・料金について</span></label>
        <label class="type-option"><input type="radio" name="inquiryType"><span>取材・お仕事のご相談</span></label>
        <label class="type-option"><input type="radio" name="inquiryType"><span>その他</span></label>
      </div>
    </div>
    <div class="f-group"><label>お問い合わせ内容 <span class="req">必須</span></label><textarea required></textarea></div>
  </div>

  <div class="submit-block">
    <button type="submit" class="btn-fill">送信する　→</button>
    <p class="submit-note">送信後、担当者より2〜3営業日以内にご連絡いたします。</p>
  </div>

</form>

<footer>
  © 2026 O-HA-SHI GK. All Rights Reserved.
</footer>

</body>
</html>
