*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

header{position:relative;padding:26px 6vw;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);}

.page-head{padding:9vh 0 4vh;text-align:center;}

.lead{max-width:600px;margin:0 auto;text-align:center;font-family:"Shippori Mincho",serif;font-size:13.5px;line-height:2.4;color:var(--body);}

.sect{padding:8vh 0;}

.info-table{width:100%;border-collapse:collapse;font-family:"Shippori Mincho",serif;font-size:13px;}
.info-table tr{border-top:1px solid var(--line);}
.info-table tr:last-child{border-bottom:1px solid var(--line);}
.info-table th{width:220px;text-align:left;padding:20px 16px 20px 0;color:var(--muted);font-weight:400;vertical-align:top;font-family:Cinzel,serif;font-size:10px;letter-spacing:.06em;text-transform:lowercase;}
.info-table td{padding:20px 0;color:var(--body);line-height:2.1;}
.info-table .pending{color:var(--muted);}
@media(max-width:640px){
  .info-table, .info-table tbody, .info-table tr, .info-table th, .info-table td{display:block;width:100%;}
  .info-table th{padding-bottom:6px;}
  .info-table td{padding-top:0;padding-bottom:20px;}
}

footer{border-top:1px solid var(--line);padding:56px 6vw 40px;text-align:center;font-family:"Shippori Mincho",serif;font-size:11px;color:var(--muted);}
footer .links{margin-top:14px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap;}
footer .links a{color:var(--muted);}
footer .links a:hover{color:var(--ink);}
